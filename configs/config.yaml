paths:
  openai_api_key_fpath: /home/ambati/.openai_api_key.zshrc      # path to OpenAI API key
  data: /playpen-hdd/ambati/interact_plus/data/                 # path to data
  experiments: /playpen-hdd/ambati/interact_plus/experiments/   # path to save experiment results
  hf_home: /playpen-hdd/shared/pretrained_models/               # Hugging Face cache dir

# Model
teacher:
  model: qwen72
  temperature: 0.8
  server: "sglang"  # SGLang/vLLM
  gpus: [0,1,2,3]

student:
  model: qwen7
  lora:
  temperature: 0.8
  server: "sglang"  # SGLang/vLLM
  gpus: [4,5,6,7]

guide:
  model: qwen30
  temperature: 0.8
  server: "sglang"  # SGLang/vLLM
  gpus: [0, 1]

# Data & paths
data:
  type: math                    # code or math
  data_amount: 10000000
  split: train

# Generation / evaluation
gen:
  k_values: [1, 5, 10]
  num_samples: 25
  rlhf_samples: 5
  pass_k: 5
  pass_at_k_threshold: 0.5
  eps: 0.2                      # epsilon-greedy exploration
  retry_on_fail: 5
  take_every: 1                 # only used for math dataset
  dagger_iter: 0                # DAgger iteration

# Direct Preference Optimization (DPO) settings
train:
  train_size: 0.5
  val_size: 0.2
  sft_use_4bit: False
  rlhf_use_4bit: True
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  sft_batch_size: 4
  rlhf_batch_size: 2
  grpo_batch_size_groups: 2
  grad_accum: 8
  sft_lr: 1e-4
  rlhf_lr: 1e-5
  grpo_lr: 5e-6  
  beta: 0.2
  sft_epochs: 5
  rlhf_epochs: 5
  grpo_epochs: 2
  grpo_tau: 0.7
  grpo_reward_norm: "zscore"
  grpo_kl_coeff: 0.02  
  gpus: [0,1,2,3,4,5,6,7]

# Experiment settings
experiment:
  name: data_collection
  cot: False
  ood: False
  dataset: gsm8k        # code - humaneval_opc/mbpp, math - gsm8k
  assessment_turn: -1   # -1 (none), 1 (pre), 5 (mid)
  start_from_turn: 1    # 1 (new), odd (student), even (teacher)
  total_turns: 11
  num_workers: 32

hydra:
  run:
    dir: ${paths.experiments}/${experiment.name}/${teacher.model}/${student.model}/${experiment.dataset}
  output_subdir: .
