paths:
  openai_api_key_fpath: /home/ambati/.openai_api_key.zshrc      # path to OpenAI API key
  data: /playpen-ssd/ambati/interact_plus/data/                 # path to data
  experiments: /playpen-ssd/ambati/interact_plus/experiments/   # path to save experiment results

# Model
teacher:
  model: gpt-4o
  temperature: 0.3

student:
  model: qwen7_dpo
  temperature: 0.3

# Data & paths
data:
  type: code                    # code or math
  filename: qwen7
  data_amount: 100

# Generation / evaluation
gen:
  k_values: [1, 5, 10]
  num_samples: 10
  pass_k: 5
  pass_at_k_threshold: 0.75
  retry_on_fail: 5
  take_every: 3                 # only used for math dataset

# Direct Preference Optimization (DPO) settings
dpo:
  data_dir1: ${paths.experiments}/unguided/gpt-4o/qwen7/humaneval_opc/
  data_dir2: ${paths.experiments}/${experiments.name}/gpt-4o/qwen32/humaneval_opc/
  model_fpath: /playpen-hdd/shared/pretrained_models/Qwen/models--Qwen--Qwen2.5-7B-Instruct/snapshots/a09a35458c702b33eeacc393d103063234e8bc28/
  split: 0.8
  use_4bit: True
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  batch_size: 6
  grad_accum: 8
  lr: 5e-6
  beta: 0.1
  epochs: 3
  gpus: [2]

# Experiment settings
experiment:
  name: unguided_from_qwen32
  cot: False
  ood: False
  dataset: humaneval_opc        # code - humaneval_opc/mbpp, math - gsm
  assessment_turn: -1           # -1 (none), 1 (pre), 5 (mid)
  start_from_turn: 1            # 1 (new), odd (student), even (teacher)
  total_turns: 11
  num_workers: 16

hydra:
  run:
    dir: ${paths.experiments}/${experiment.name}/${teacher.model}/${student.model}/${experiment.dataset}
  output_subdir: .
